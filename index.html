<script>const comments=["Os cinco princípios expressos são lembrados pela sigla LIMPE: legalidade, impessoalidade, moralidade, publicidade e eficiência. Valem para todos os Poderes e entes federativos, tanto na administração direta quanto na indireta.", "O brasileiro pode acessar cargos, empregos e funções se cumprir os requisitos legais. O estrangeiro também pode, conforme a forma prevista em lei.", "A regra para ocupar cargo ou emprego público é a aprovação prévia em concurso. A exceção indicada é a nomeação para cargo em comissão de livre nomeação e exoneração, conforme a lei.", "O edital pode fixar validade de até dois anos. É possível uma única prorrogação, por período igual ao inicialmente definido.", "Enquanto vigora o período de convocação previsto no edital, o aprovado no concurso anterior tem prioridade sobre novos concursados para a mesma carreira.", "Função de confiança é exclusiva de servidor efetivo. Cargo em comissão segue os percentuais e condições legais para servidores de carreira. Ambos servem apenas para direção, chefia e assessoramento.", "O servidor público civil pode se associar livremente a sindicato. Trata-se de garantia constitucional.", "O direito de greve do servidor público é reconhecido, com exercício sujeito aos termos e limites definidos em lei específica.", "A lei deve reservar parte dos cargos e empregos para pessoas com deficiência e estabelecer os critérios para sua admissão.", "A contratação temporária depende de hipótese prevista em lei e de necessidade temporária de excepcional interesse público.", "Fixar ou alterar remuneração e subsídio exige lei específica, respeitada a iniciativa competente. A revisão geral anual deve observar a mesma data e índices sem distinção.", "É a regra do teto remuneratório. O limite geral toma como referência o subsídio dos ministros do STF, com subtetos específicos para municípios, estados e Distrito Federal descritos no próprio inciso.", "Os vencimentos de cargos do Legislativo e do Judiciário não podem superar os pagos pelo Executivo, conforme o parâmetro constitucional.", "Não se pode atrelar automaticamente uma remuneração a outra nem equiparar espécies remuneratórias para definir o pagamento do pessoal público.", "Um adicional ou acréscimo recebido pelo servidor não entra na base de cálculo de novos acréscimos posteriores. Evita-se o chamado efeito cascata.", "A regra é a irredutibilidade do subsídio e dos vencimentos, ressalvadas as hipóteses constitucionais expressamente citadas no dispositivo.", "A acumulação remunerada de cargos é proibida como regra. As exceções das alíneas exigem compatibilidade de horários e observância do teto remuneratório.", "É permitida a acumulação de dois cargos de professor, se os horários forem compatíveis e respeitado o teto.", "É permitida a acumulação de um cargo de professor com outro de qualquer natureza, se os horários forem compatíveis e respeitado o teto. Esta é a redação trazida pela EC 138/2025.", "É permitida a acumulação de dois cargos ou empregos privativos de profissionais de saúde com profissões regulamentadas, observadas as condições do inciso XVI.", "A vedação à acumulação alcança também empregos e funções nas entidades da administração indireta e nas sociedades controladas pelo poder público indicadas no texto.", "Na área de sua competência, a administração fazendária e seus fiscais têm precedência sobre outros setores administrativos, nos termos da lei.", "Lei específica cria diretamente uma autarquia. Para empresa pública, sociedade de economia mista e fundação, a lei específica autoriza a instituição; lei complementar define as áreas de atuação das fundações.", "A criação de subsidiárias dessas entidades e a participação delas em empresa privada dependem de autorização legislativa em cada caso.", "A contratação pública deve observar licitação que assegure igualdade entre concorrentes, ressalvadas as hipóteses previstas na legislação. As exigências de qualificação devem ser indispensáveis ao cumprimento do contrato.", "A administração tributária é essencial ao Estado: atua com servidores de carreiras específicas, tem recursos prioritários e pode integrar cadastros e informações fiscais nos termos da lei ou de convênio.", "A publicidade institucional deve informar, educar ou orientar a sociedade. Não pode usar nomes, símbolos ou imagens para promover pessoalmente autoridades ou servidores.", "O descumprimento das regras dos incisos II e III sobre concurso e validade acarreta nulidade do ato e punição da autoridade responsável, conforme a lei.", "A lei deve organizar maneiras de o usuário participar da administração pública, especialmente reclamações, acesso a informações e representação contra abusos.", "O cidadão deve poder reclamar sobre serviços públicos; também devem existir atendimento ao usuário e avaliações periódicas da qualidade dos serviços.", "O usuário pode acessar registros administrativos e informações sobre atos de governo, observados os direitos e limites constitucionais citados no inciso.", "Deve haver disciplina para representar contra exercício negligente ou abusivo de cargo, emprego ou função pública.", "A improbidade pode acarretar as consequências listadas, conforme a lei e a gravidade do caso, sem excluir eventual ação penal cabível.", "A lei fixa prazos de prescrição para ilícitos que prejudiquem o erário. A ressalva sobre ressarcimento deve ser lida conforme a jurisprudência aplicável ao tipo de conduta, sem presumir que toda ação de ressarcimento seja imprescritível.", "O ente público ou prestador privado de serviço público responde pelos danos que seu agente causar a terceiros nessa condição. Se houver dolo ou culpa do agente, cabe ação regressiva contra ele.", "A lei pode impor requisitos e restrições a ocupantes de cargos ou empregos que deem acesso a informações privilegiadas.", "Um contrato com metas de desempenho pode ampliar a autonomia de órgão ou entidade. A lei deve disciplinar duração, controles, responsabilidades e remuneração.", "A lei deve definir por quanto tempo vigora o contrato de metas mencionado no § 8º.", "A lei deve estabelecer controles e avaliação de desempenho, além de direitos, obrigações e responsabilidade dos dirigentes no contrato de metas.", "A lei também deve tratar da remuneração do pessoal no contexto do contrato de metas.", "O teto do inciso XI atinge empresas públicas, sociedades de economia mista e subsidiárias quando recebem recursos do ente público para pessoal ou custeio geral.", "Em regra, não se acumulam esses proventos de aposentadoria com remuneração de cargo, emprego ou função pública. O próprio parágrafo ressalva cargos constitucionalmente acumuláveis, cargos eletivos e cargos em comissão de livre nomeação e exoneração.", "O dispositivo trata da exclusão, do cálculo do teto, das parcelas indenizatórias previstas em lei ordinária nacional aprovada pelo Congresso. Sua aplicação deve observar também a regra transitória da EC 135/2024.", "Estados e Distrito Federal podem adotar, por emenda às suas normas próprias, um subteto único baseado no subsídio dos desembargadores, dentro do limite constitucional; há exceções expressas para deputados e vereadores.", "O servidor efetivo com limitação física ou mental pode ser readaptado para cargo compatível, desde que cumpra a habilitação e a escolaridade exigidas. Mantém a remuneração do cargo de origem enquanto perdurar a condição.", "Se a aposentadoria utilizar tempo de contribuição originado de determinado vínculo público, esse vínculo é rompido pela concessão do benefício.", "A complementação de aposentadoria ou pensão é vedada, salvo nas hipóteses previdenciárias ou de extinção de regime próprio expressamente indicadas.", "Órgãos e entidades devem avaliar políticas públicas e divulgar o que será avaliado e os resultados obtidos, conforme a lei.", "O art. 38 disciplina o que acontece com o vínculo do servidor da administração direta, autárquica ou fundacional quando ele exerce mandato eletivo.", "No mandato federal, estadual ou distrital, o servidor fica afastado do seu cargo, emprego ou função.", "Quem assume o mandato de prefeito se afasta do cargo, emprego ou função de origem e pode optar pela remuneração que receberá.", "O vereador com horários compatíveis recebe as vantagens do vínculo de origem e a remuneração do mandato. Sem compatibilidade, aplica-se a regra do prefeito: afastamento e opção pela remuneração.", "Quando o mandato exige afastamento, o tempo de serviço continua contando para efeitos legais, exceto para promoção por merecimento.", "Se o servidor for segurado de regime próprio de previdência, permanece vinculado ao regime do ente federativo de origem durante o mandato."];const items=[{"label": "Art. 37.", "text": "DA ADMINISTRAÇÃO PÚBLICA\nSEÇÃO I\nDISPOSIÇÕES GERAIS\nArt. 37. A administração pública direta e indireta de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios obedecerá aos princípios de legalidade, impessoalidade, moralidade, publicidade e eficiência e, também, ao seguinte:             (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "I -", "text": "I - os cargos, empregos e funções públicas são acessíveis aos brasileiros que preencham os requisitos estabelecidos em lei, assim como aos estrangeiros, na forma da lei;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "II -", "text": "II - a investidura em cargo ou emprego público depende de aprovação prévia em concurso público de provas ou de provas e títulos, de acordo com a natureza e a complexidade do cargo ou emprego, na forma prevista em lei, ressalvadas as nomeações para cargo em comissão declarado em lei de livre nomeação e exoneração;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "III -", "text": "III - o prazo de validade do concurso público será de até dois anos, prorrogável uma vez, por igual período;"}, {"label": "IV -", "text": "IV - durante o prazo improrrogável previsto no edital de convocação, aquele aprovado em concurso público de provas ou de provas e títulos será convocado com prioridade sobre novos concursados para assumir cargo ou emprego, na carreira;"}, {"label": "V -", "text": "V - as funções de confiança, exercidas exclusivamente por servidores ocupantes de cargo efetivo, e os cargos em comissão, a serem preenchidos por servidores de carreira nos casos, condições e percentuais mínimos previstos em lei, destinam-se apenas às atribuições de direção, chefia e assessoramento;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "VI -", "text": "VI - é garantido ao servidor público civil o direito à livre associação sindical;"}, {"label": "VII -", "text": "VII - o direito de greve será exercido nos termos e nos limites definidos em lei específica;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "VIII -", "text": "VIII - a lei reservará percentual dos cargos e empregos públicos para as pessoas portadoras de deficiência e definirá os critérios de sua admissão;"}, {"label": "IX -", "text": "IX - a lei estabelecerá os casos de contratação por tempo determinado para atender a necessidade temporária de excepcional interesse público;        (Vide Emenda constitucional nº 106, de 2020)"}, {"label": "X -", "text": "X - a remuneração dos servidores públicos e o subsídio de que trata o § 4º do art. 39 somente poderão ser fixados ou alterados por lei específica, observada a iniciativa privativa em cada caso, assegurada revisão geral anual, sempre na mesma data e sem distinção de índices;         (Redação dada pela Emenda Constitucional nº 19, de 1998)         (Regulamento)"}, {"label": "XI -", "text": "XI - a remuneração e o subsídio dos ocupantes de cargos, funções e empregos públicos da administração direta, autárquica e fundacional, dos membros de qualquer dos Poderes da União, dos Estados, do Distrito Federal e dos Municípios, dos detentores de mandato eletivo e dos demais agentes políticos e os proventos, pensões ou outra espécie remuneratória, percebidos cumulativamente ou não, incluídas as vantagens pessoais ou de qualquer outra natureza, não poderão exceder o subsídio mensal, em espécie, dos Ministros do Supremo Tribunal Federal, aplicando-se como limite, nos Municípios, o subsídio do Prefeito, e nos Estados e no Distrito Federal, o subsídio mensal do Governador no âmbito do Poder Executivo, o subsídio dos Deputados Estaduais e Distritais no âmbito do Poder Legislativo e o subsídio dos Desembargadores do Tribunal de Justiça, limitado a noventa inteiros e vinte e cinco centésimos por cento do subsídio mensal, em espécie, dos Ministros do Supremo Tribunal Federal, no âmbito do Poder Judiciário, aplicável este limite aos membros do Ministério Público, aos Procuradores e aos Defensores Públicos;         (Redação dada pela Emenda Constitucional nº 41, 19.12.2003)"}, {"label": "XII -", "text": "XII - os vencimentos dos cargos do Poder Legislativo e do Poder Judiciário não poderão ser superiores aos pagos pelo Poder Executivo;"}, {"label": "XIII -", "text": "XIII - é vedada a vinculação ou equiparação de quaisquer espécies remuneratórias para o efeito de remuneração de pessoal do serviço público;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "XIV -", "text": "XIV - os acréscimos pecuniários percebidos por servidor público não serão computados nem acumulados para fins de concessão de acréscimos ulteriores;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "XV -", "text": "XV - o subsídio e os vencimentos dos ocupantes de cargos e empregos públicos são irredutíveis, ressalvado o disposto nos incisos XI e XIV deste artigo e nos arts. 39, § 4º, 150, II, 153, III, e 153, § 2º, I;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "XVI -", "text": "XVI - é vedada a acumulação remunerada de cargos públicos, exceto, quando houver compatibilidade de horários, observado em qualquer caso o disposto no inciso XI:         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "a)", "text": "a) a de dois cargos de professor;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "b)", "text": "b) a de um cargo de professor com outro de qualquer natureza;    (Redação dada pela Emenda Constitucional nº 138, de 2025)"}, {"label": "c)", "text": "c) a de dois cargos ou empregos privativos de profissionais de saúde, com profissões regulamentadas;         (Redação dada pela Emenda Constitucional nº 34, de 2001)"}, {"label": "XVII -", "text": "XVII - a proibição de acumular estende-se a empregos e funções e abrange autarquias, fundações, empresas públicas, sociedades de economia mista, suas subsidiárias, e sociedades controladas, direta ou indiretamente, pelo poder público;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "XVIII -", "text": "XVIII - a administração fazendária e seus servidores fiscais terão, dentro de suas áreas de competência e jurisdição, precedência sobre os demais setores administrativos, na forma da lei;"}, {"label": "XIX -", "text": "XIX - somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação, cabendo à lei complementar, neste último caso, definir as áreas de sua atuação;         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "XX -", "text": "XX - depende de autorização legislativa, em cada caso, a criação de subsidiárias das entidades mencionadas no inciso anterior, assim como a participação de qualquer delas em empresa privada;"}, {"label": "XXI -", "text": "XXI - ressalvados os casos especificados na legislação, as obras, serviços, compras e alienações serão contratados mediante processo de licitação pública que assegure igualdade de condições a todos os concorrentes, com cláusulas que estabeleçam obrigações de pagamento, mantidas as condições efetivas da proposta, nos termos da lei, o qual somente permitirá as exigências de qualificação técnica e econômica indispensáveis à garantia do cumprimento das obrigações.         (Regulamento)"}, {"label": "XXII -", "text": "XXII - as administrações tributárias da União, dos Estados, do Distrito Federal e dos Municípios, atividades essenciais ao funcionamento do Estado, exercidas por servidores de carreiras específicas, terão recursos prioritários para a realização de suas atividades e atuarão de forma integrada, inclusive com o compartilhamento de cadastros e de informações fiscais, na forma da lei ou convênio.         (Incluído pela Emenda Constitucional nº 42, de 19.12.2003)"}, {"label": "§ 1º", "text": "§ 1º A publicidade dos atos, programas, obras, serviços e campanhas dos órgãos públicos deverá ter caráter educativo, informativo ou de orientação social, dela não podendo constar nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou servidores públicos."}, {"label": "§ 2º", "text": "§ 2º A não observância do disposto nos incisos II e III implicará a nulidade do ato e a punição da autoridade responsável, nos termos da lei."}, {"label": "§ 3º", "text": "§ 3º A lei disciplinará as formas de participação do usuário na administração pública direta e indireta, regulando especialmente:         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "I -", "text": "I - as reclamações relativas à prestação dos serviços públicos em geral, asseguradas a manutenção de serviços de atendimento ao usuário e a avaliação periódica, externa e interna, da qualidade dos serviços;         (Incluído pela Emenda Constitucional nº 19, de 1998)"}, {"label": "II -", "text": "II - o acesso dos usuários a registros administrativos e a informações sobre atos de governo, observado o disposto no art. 5º, X e XXXIII;         (Incluído pela Emenda Constitucional nº 19, de 1998)         (Vide Lei nº 12.527, de 2011)"}, {"label": "III -", "text": "III - a disciplina da representação contra o exercício negligente ou abusivo de cargo, emprego ou função na administração pública.         (Incluído pela Emenda Constitucional nº 19, de 1998)"}, {"label": "§ 4º", "text": "§ 4º Os atos de improbidade administrativa importarão a suspensão dos direitos políticos, a perda da função pública, a indisponibilidade dos bens e o ressarcimento ao erário, na forma e gradação previstas em lei, sem prejuízo da ação penal cabível."}, {"label": "§ 5º", "text": "§ 5º A lei estabelecerá os prazos de prescrição para ilícitos praticados por qualquer agente, servidor ou não, que causem prejuízos ao erário, ressalvadas as respectivas ações de ressarcimento."}, {"label": "§ 6º", "text": "§ 6º As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa."}, {"label": "§ 7º", "text": "§ 7º A lei disporá sobre os requisitos e as restrições ao ocupante de cargo ou emprego da administração direta e indireta que possibilite o acesso a informações privilegiadas.         (Incluído pela Emenda Constitucional nº 19, de 1998)"}, {"label": "§ 8º", "text": "§ 8º A autonomia gerencial, orçamentária e financeira dos órgãos e entidades da administração direta e indireta poderá ser ampliada mediante contrato, a ser firmado entre seus administradores e o poder público, que tenha por objeto a fixação de metas de desempenho para o órgão ou entidade, cabendo à lei dispor sobre:         (Incluído pela Emenda Constitucional nº 19, de 1998)            (Regulamento)    (Vigência)"}, {"label": "I -", "text": "I - o prazo de duração do contrato;         (Incluído pela Emenda Constitucional nº 19, de 1998)"}, {"label": "II -", "text": "II - os controles e critérios de avaliação de desempenho, direitos, obrigações e responsabilidade dos dirigentes;         (Incluído pela Emenda Constitucional nº 19, de 1998)"}, {"label": "III -", "text": "III - a remuneração do pessoal.         (Incluído pela Emenda Constitucional nº 19, de 1998)"}, {"label": "§ 9º", "text": "§ 9º O disposto no inciso XI aplica-se às empresas públicas e às sociedades de economia mista, e suas subsidiárias, que receberem recursos da União, dos Estados, do Distrito Federal ou dos Municípios para pagamento de despesas de pessoal ou de custeio em geral.         (Incluído pela Emenda Constitucional nº 19, de 1998)"}, {"label": "§ 10.", "text": "§ 10. É vedada a percepção simultânea de proventos de aposentadoria decorrentes do art. 40 ou dos arts. 42 e 142 com a remuneração de cargo, emprego ou função pública, ressalvados os cargos acumuláveis na forma desta Constituição, os cargos eletivos e os cargos em comissão declarados em lei de livre nomeação e exoneração.         (Incluído pela Emenda Constitucional nº 20, de 1998)         (Vide Emenda Constitucional nº 20, de 1998)"}, {"label": "§ 11.", "text": "§ 11. Não serão computadas, para efeito dos limites remuneratórios de que trata o inciso XI do caput deste artigo, as parcelas de caráter indenizatório expressamente previstas em lei ordinária, aprovada pelo Congresso Nacional, de caráter nacional, aplicada a todos os Poderes e órgãos constitucionalmente autônomos.    (Redação dada pela Emenda Constitucional nº 135, de 2024)"}, {"label": "§ 12.", "text": "§ 12. Para os fins do disposto no inciso XI do caput deste artigo, fica facultado aos Estados e ao Distrito Federal fixar, em seu âmbito, mediante emenda às respectivas Constituições e Lei Orgânica, como limite único, o subsídio mensal dos Desembargadores do respectivo Tribunal de Justiça, limitado a noventa inteiros e vinte e cinco centésimos por cento do subsídio mensal dos Ministros do Supremo Tribunal Federal, não se aplicando o disposto neste parágrafo aos subsídios dos Deputados Estaduais e Distritais e dos Vereadores.         (Incluído pela Emenda Constitucional nº 47, de 2005)"}, {"label": "§ 13.", "text": "§ 13. O servidor público titular de cargo efetivo poderá ser readaptado para exercício de cargo cujas atribuições e responsabilidades sejam compatíveis com a limitação que tenha sofrido em sua capacidade física ou mental, enquanto permanecer nesta condição, desde que possua a habilitação e o nível de escolaridade exigidos para o cargo de destino, mantida a remuneração do cargo de origem.           (Incluído pela Emenda Constitucional nº 103, de 2019)"}, {"label": "§ 14.", "text": "§ 14. A aposentadoria concedida com a utilização de tempo de contribuição decorrente de cargo, emprego ou função pública, inclusive do Regime Geral de Previdência Social, acarretará o rompimento do vínculo que gerou o referido tempo de contribuição.           (Incluído pela Emenda Constitucional nº 103, de 2019)"}, {"label": "§ 15.", "text": "§ 15. É vedada a complementação de aposentadorias de servidores públicos e de pensões por morte a seus dependentes que não seja decorrente do disposto nos §§ 14 a 16 do art. 40 ou que não seja prevista em lei que extinga regime próprio de previdência social.           (Incluído pela Emenda Constitucional nº 103, de 2019)"}, {"label": "§ 16.", "text": "§ 16. Os órgãos e entidades da administração pública, individual ou conjuntamente, devem realizar avaliação das políticas públicas, inclusive com divulgação do objeto a ser avaliado e dos resultados alcançados, na forma da lei.       (Incluído pela Emenda Constitucional nº 109, de 2021)"}, {"label": "Art. 38.", "text": "Art. 38. Ao servidor público da administração direta, autárquica e fundacional, no exercício de mandato eletivo, aplicam-se as seguintes disposições:         (Redação dada pela Emenda Constitucional nº 19, de 1998)"}, {"label": "I -", "text": "I - tratando-se de mandato eletivo federal, estadual ou distrital, ficará afastado de seu cargo, emprego ou função;"}, {"label": "II -", "text": "II - investido no mandato de Prefeito, será afastado do cargo, emprego ou função, sendo-lhe facultado optar pela sua remuneração;"}, {"label": "III -", "text": "III - investido no mandato de Vereador, havendo compatibilidade de horários, perceberá as vantagens de seu cargo, emprego ou função, sem prejuízo da remuneração do cargo eletivo, e, não havendo compatibilidade, será aplicada a norma do inciso anterior;"}, {"label": "IV -", "text": "IV - em qualquer caso que exija o afastamento para o exercício de mandato eletivo, seu tempo de serviço será contado para todos os efeitos legais, exceto para promoção por merecimento;"}, {"label": "V -", "text": "V - na hipótese de ser segurado de regime próprio de previdência social, permanecerá filiado a esse regime, no ente federativo de origem."}];let index=0;const $=id=>document.getElementById(id);function render(){const item=items[index];$('badge').textContent=item.label;$('body').textContent=item.text;$('comment').textContent=comments[index];$('count').textContent=`Tela ${index+1} de ${items.length}`;$('bar').max=items.length;$('bar').value=index+1;$('prev').disabled=index===0;$('next').disabled=index===items.length-1;window.scrollTo({top:0,behavior:'instant'})} $('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<items.length-1){index++;render()}};$('reset').onclick=()=>{index=0;render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});let touchStart=null;document.addEventListener('touchstart',e=>{touchStart={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0)$('next').click();else $('prev').click()}touchStart=null},{passive:true});render();</script></body></html>
